<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Metadata and styling links -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberTicTacToe - AI Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main cyberpunk header -->
    <header>
        <h1>// CYBER_TIC_TAC_TOE</h1>
        <p>System Status: Online. Play against the AI core.</p>
    </header>

    <main>
        <!-- Game container -->
        <section class="game-container">
            <div id="statusDisplay" class="status">Player X's Turn</div>
            
            <!-- 3x3 Tic Tac Toe Grid -->
            <div class="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>

            <button id="restartBtn">Reboot System</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 CyberDev Journey</p>
    </footer>

    <!-- Link to JavaScript game logic -->
    <script src="script.js"></script>
</body>
</html>
